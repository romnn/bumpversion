[tool.bumpversion]
current_version = "1.2.0-alpha.1"

# TOML literal strings (single quotes) keep regex backslashes as written —
# no doubling, unlike the basic "..." strings.
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(\-(?P<pre_label>[a-z]+)\.(?P<pre_n>\d+))?'

# Tried in order; the first pattern whose optional components are all present
# wins, so a released version serializes without the pre-release suffix.
serialize = [
  "{major}.{minor}.{patch}-{pre_label}.{pre_n}",
  "{major}.{minor}.{patch}",
]

[tool.bumpversion.parts.pre_label]
values = ["alpha", "beta", "rc", "final"]
optional_value = "final"

[[tool.bumpversion.files]]
filename = "VERSION"
